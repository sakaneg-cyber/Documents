<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر المحفوظات - نظام إدارة المستندات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: #fafaf9;
    color: #1c1917;
    min-height: 100vh;
  }
  .serif { font-family: 'Amiri', serif; }
  
  /* الترويسة */
  header {
    background: white;
    border-bottom: 1px solid #e7e5e4;
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.95);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #d97706, #c2410c);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
  }
  .logo h1 {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: #1c1917;
  }
  .logo p { font-size: 11px; color: #78716c; }
  
  .search-box {
    flex: 1;
    max-width: 500px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 40px 10px 16px;
    background: #f5f5f4;
    border: 1px solid transparent;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-box input:focus {
    border-color: #d97706;
    background: white;
  }
  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #a8a29e;
  }
  
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn-secondary {
    background: #f5f5f4;
    color: #44403c;
  }
  .btn-secondary:hover { background: #e7e5e4; }
  .btn-primary {
    background: linear-gradient(135deg, #d97706, #c2410c);
    color: white;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #b45309, #9a3412);
  }
  
  /* التخطيط */
  .layout {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    gap: 24px;
  }
  
  /* الشريط الجانبي */
  aside {
    width: 256px;
    flex-shrink: 0;
  }
  .sidebar {
    background: white;
    border-radius: 12px;
    border: 1px solid #e7e5e4;
    padding: 16px;
    position: sticky;
    top: 90px;
  }
  .nav-item {
    width: 100%;
    text-align: right;
    padding: 8px 12px;
    border-radius: 8px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: #44403c;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .nav-item:hover { background: #fafaf9; }
  .nav-item.active {
    background: #fef3c7;
    color: #78350f;
    font-weight: 500;
  }
  .nav-item .count {
    margin-right: auto;
    font-size: 12px;
    color: #a8a29e;
  }
  .nav-section {
    margin-top: 24px;
  }
  .nav-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #78716c;
    font-weight: 500;
    padding: 0 12px;
    margin-bottom: 8px;
  }
  .folder-row {
    display: flex;
    align-items: center;
  }
  .folder-row .nav-item { flex: 1; }
  .folder-delete {
    opacity: 0;
    background: none;
    border: none;
    padding: 4px;
    border-radius: 4px;
    cursor: pointer;
    color: #a8a29e;
    transition: all 0.15s;
  }
  .folder-row:hover .folder-delete { opacity: 1; }
  .folder-delete:hover { background: #fef2f2; color: #dc2626; }
  
  .tags-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 4px;
  }
  .tag-chip {
    padding: 4px 8px;
    border-radius: 6px;
    background: #f5f5f4;
    color: #57534e;
    font-size: 11px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .tag-chip:hover { background: #e7e5e4; }
  .tag-chip.active {
    background: #d97706;
    color: white;
  }
  
  /* المحتوى */
  main { flex: 1; min-width: 0; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .toolbar-title {
    font-family: 'Amiri', serif;
    font-size: 22px;
    font-weight: 700;
    color: #1c1917;
  }
  .toolbar-count {
    font-size: 14px;
    color: #a8a29e;
    margin-right: 8px;
  }
  select {
    padding: 6px 12px;
    background: white;
    border: 1px solid #e7e5e4;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: #44403c;
    cursor: pointer;
  }
  
  /* شبكة المستندات */
  .docs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .doc-card {
    background: white;
    border-radius: 12px;
    border: 1px solid #e7e5e4;
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .doc-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -8px rgba(120, 100, 80, 0.2);
  }
  .doc-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .doc-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #fef3c7, #fed7aa);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b45309;
    font-size: 18px;
  }
  .doc-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .icon-btn {
    background: none;
    border: none;
    padding: 6px;
    border-radius: 6px;
    cursor: pointer;
    color: #d6d3d1;
    transition: all 0.15s;
  }
  .icon-btn:hover { color: #44403c; background: #fafaf9; }
  .icon-btn.starred { color: #f59e0b; }
  .icon-btn.delete:hover { color: #dc2626; background: #fef2f2; }
  
  .doc-card h3 {
    font-family: 'Amiri', serif;
    font-size: 17px;
    font-weight: 700;
    color: #1c1917;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .doc-card p {
    font-size: 13px;
    color: #57534e;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .doc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }
  .doc-tag {
    padding: 2px 8px;
    background: #f5f5f4;
    color: #57534e;
    border-radius: 4px;
    font-size: 11px;
  }
  .doc-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #a8a29e;
    padding-top: 12px;
    border-top: 1px solid #f5f5f4;
  }
  .doc-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  /* حالة فارغة */
  .empty-state {
    background: white;
    border-radius: 16px;
    border: 2px dashed #e7e5e4;
    padding: 64px 24px;
    text-align: center;
  }
  .empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #f5f5f4;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a8a29e;
    font-size: 28px;
  }
  .empty-state h3 {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: #44403c;
    margin-bottom: 8px;
  }
  .empty-state p {
    color: #78716c;
    font-size: 14px;
    margin-bottom: 24px;
  }
  
  /* المودال */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 25, 23, 0.5);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal {
    background: white;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-sm { max-width: 420px; }
  .modal-lg { max-width: 768px; }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid #e7e5e4;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h2 {
    font-family: 'Amiri', serif;
    font-size: 20px;
    font-weight: 700;
    color: #1c1917;
  }
  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid #e7e5e4;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #44403c;
    margin-bottom: 6px;
  }
  .form-group label .hint {
    font-size: 11px;
    color: #a8a29e;
    font-weight: 400;
  }
  .form-control {
    width: 100%;
    padding: 10px 16px;
    background: #fafaf9;
    border: 1px solid #e7e5e4;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.15s;
  }
  .form-control:focus {
    border-color: #d97706;
    background: white;
  }
  textarea.form-control {
    resize: vertical;
    min-height: 200px;
    line-height: 1.6;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  
  /* المستند المعروض */
  .view-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .view-tag {
    padding: 4px 10px;
    background: #fef3c7;
    color: #78350f;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .view-folder {
    font-size: 13px;
    color: #78716c;
    margin-bottom: 16px;
  }
  .view-content {
    white-space: pre-wrap;
    color: #292524;
    line-height: 1.75;
    font-size: 15px;
  }
  
  .filter-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-pills > span:first-child {
    font-size: 12px;
    color: #78716c;
  }
  .filter-pill {
    padding: 4px 10px;
    background: #fef3c7;
    color: #78350f;
    border-radius: 6px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-pill button {
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    padding: 0;
    display: flex;
  }
  
  /* الموبايل */
  @media (max-width: 900px) {
    aside { display: none; }
    .header-inner { flex-wrap: wrap; }
    .search-box { order: 3; flex-basis: 100%; max-width: 100%; }
  }
  
  /* رسائل */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1c1917;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 100;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .star-fill { fill: currentColor; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <h1>دفتر المحفوظات</h1>
        <p>نظام إدارة المستندات</p>
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث في العناوين والمحتوى والوسوم...">
    </div>
    <button class="btn btn-secondary" onclick="openFolderModal()">
      <span>📁</span><span>مجلد جديد</span>
    </button>
    <button class="btn btn-primary" onclick="openDocModal()">
      <span>+</span><span>مستند جديد</span>
    </button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar">
      <button class="nav-item active" id="navAll" onclick="setFolder(null)">
        <span>📄</span><span>كل المستندات</span>
        <span class="count" id="countAll">0</span>
      </button>
      <button class="nav-item" id="navStarred" onclick="toggleStarredFilter()">
        <span>⭐</span><span>المفضلة</span>
        <span class="count" id="countStarred">0</span>
      </button>

      <div class="nav-section">
        <h3>المجلدات</h3>
        <div id="foldersList"></div>
      </div>

      <div class="nav-section" id="tagsSection" style="display:none">
        <h3>الوسوم</h3>
        <div class="tags-list" id="tagsList"></div>
      </div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div>
        <span class="toolbar-title" id="currentViewTitle">كل المستندات</span>
        <span class="toolbar-count" id="docsCount">(0 مستند)</span>
      </div>
      <select id="sortSelect" onchange="render()">
        <option value="date">الأحدث</option>
        <option value="name">الاسم</option>
        <option value="size">الحجم</option>
      </select>
    </div>

    <div class="filter-pills hidden" id="filterPills"></div>
    <div id="docsContainer"></div>
  </main>
</div>

<!-- مودال المستند -->
<div class="modal-overlay hidden" id="docModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="docModalTitle">مستند جديد</h2>
      <button class="icon-btn" onclick="closeDocModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>العنوان</label>
        <input type="text" class="form-control" id="docTitle" placeholder="مثال: فاتورة شهر يناير">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>المجلد</label>
          <select class="form-control" id="docFolder">
            <option value="">بدون مجلد</option>
          </select>
        </div>
        <div class="form-group">
          <label>النوع</label>
          <select class="form-control" id="docType">
            <option value="note">ملاحظة</option>
            <option value="contract">عقد</option>
            <option value="invoice">فاتورة</option>
            <option value="report">تقرير</option>
            <option value="letter">خطاب</option>
            <option value="other">أخرى</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>الوسوم <span class="hint">(مفصولة بفواصل)</span></label>
        <input type="text" class="form-control" id="docTags" placeholder="مثال: مالية, 2025, مهم">
      </div>
      <div class="form-group">
        <label>المحتوى</label>
        <textarea class="form-control" id="docContent" placeholder="اكتب محتوى المستند هنا..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDocModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveDoc()">حفظ</button>
    </div>
  </div>
</div>

<!-- مودال المجلد -->
<div class="modal-overlay hidden" id="folderModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>مجلد جديد</h2>
      <button class="icon-btn" onclick="closeFolderModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>اسم المجلد</label>
        <input type="text" class="form-control" id="folderName" placeholder="مثال: عقود 2025">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFolderModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveFolder()">إنشاء</button>
    </div>
  </div>
</div>

<!-- مودال العرض -->
<div class="modal-overlay hidden" id="viewModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="doc-icon">📄</div>
        <div>
          <h2 id="viewTitle"></h2>
          <p style="font-size:11px;color:#78716c" id="viewSubtitle"></p>
        </div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" onclick="editFromView()" title="تعديل">✏️</button>
        <button class="icon-btn" onclick="closeViewModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="view-meta" id="viewTags"></div>
      <div class="view-folder hidden" id="viewFolder"></div>
      <div class="view-content" id="viewContent"></div>
    </div>
  </div>
</div>

<script>
// الحالة
let documents = [];
let folders = [];
let currentFolder = null;
let starredFilter = false;
let selectedTags = [];
let searchQuery = '';
let editingDocId = null;
let viewingDocId = null;

// التخزين الدائم — يستخدم localStorage
const STORAGE_KEYS = { docs: 'dms_documents', folders: 'dms_folders' };

function loadData() {
  try {
    const d = localStorage.getItem(STORAGE_KEYS.docs);
    if (d) documents = JSON.parse(d);
    const f = localStorage.getItem(STORAGE_KEYS.folders);
    if (f) folders = JSON.parse(f);
  } catch (e) { console.error(e); }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEYS.docs, JSON.stringify(documents));
    localStorage.setItem(STORAGE_KEYS.folders, JSON.stringify(folders));
  } catch (e) { 
    showToast('فشل الحفظ');
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
}

const typeLabels = {
  note: 'ملاحظة', contract: 'عقد', invoice: 'فاتورة',
  report: 'تقرير', letter: 'خطاب', other: 'أخرى'
};

function getFilteredDocs() {
  let result = documents;
  
  if (currentFolder !== null) {
    result = result.filter(d => d.folderId === currentFolder);
  }
  if (starredFilter) {
    result = result.filter(d => d.starred);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    result = result.filter(d => 
      (d.title || '').toLowerCase().includes(q) ||
      (d.content || '').toLowerCase().includes(q) ||
      (d.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }
  if (selectedTags.length > 0) {
    result = result.filter(d => 
      selectedTags.every(t => (d.tags || []).includes(t))
    );
  }
  
  const sort = document.getElementById('sortSelect').value;
  result = [...result].sort((a, b) => {
    if (sort === 'date') return b.updatedAt - a.updatedAt;
    if (sort === 'name') return (a.title || '').localeCompare(b.title || '', 'ar');
    if (sort === 'size') return (b.size || 0) - (a.size || 0);
    return 0;
  });
  
  return result;
}

function getAllTags() {
  const set = new Set();
  documents.forEach(d => (d.tags || []).forEach(t => set.add(t)));
  return Array.from(set);
}

function render() {
  // العدّاد
  document.getElementById('countAll').textContent = documents.length;
  document.getElementById('countStarred').textContent = documents.filter(d => d.starred).length;
  
  // فعالة nav-item
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (starredFilter) {
    document.getElementById('navStarred').classList.add('active');
  } else if (currentFolder === null) {
    document.getElementById('navAll').classList.add('active');
  } else {
    const el = document.getElementById('folder-' + currentFolder);
    if (el) el.classList.add('active');
  }
  
  // المجلدات
  const foldersList = document.getElementById('foldersList');
  if (folders.length === 0) {
    foldersList.innerHTML = '<p style="font-size:12px;color:#a8a29e;padding:8px 12px">لا توجد مجلدات بعد</p>';
  } else {
    foldersList.innerHTML = folders.map(f => {
      const count = documents.filter(d => d.folderId === f.id).length;
      return `
        <div class="folder-row">
          <button class="nav-item" id="folder-${f.id}" onclick="setFolder('${f.id}')">
            <span>📁</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(f.name)}</span>
            <span class="count">${count}</span>
          </button>
          <button class="folder-delete" onclick="deleteFolder('${f.id}')" title="حذف">🗑</button>
        </div>
      `;
    }).join('');
  }
  
  // الوسوم
  const tags = getAllTags();
  const tagsSection = document.getElementById('tagsSection');
  if (tags.length > 0) {
    tagsSection.style.display = 'block';
    document.getElementById('tagsList').innerHTML = tags.map(t => 
      `<button class="tag-chip ${selectedTags.includes(t) ? 'active' : ''}" onclick="toggleTag('${escapeAttr(t)}')">${escapeHtml(t)}</button>`
    ).join('');
  } else {
    tagsSection.style.display = 'none';
  }
  
  // dropdown المجلدات في النموذج
  const folderSel = document.getElementById('docFolder');
  folderSel.innerHTML = '<option value="">بدون مجلد</option>' + 
    folders.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
  
  // العنوان
  const title = starredFilter ? 'المفضلة' : 
    (currentFolder ? folders.find(f => f.id === currentFolder)?.name : 'كل المستندات');
  document.getElementById('currentViewTitle').textContent = title;
  
  // الفلاتر النشطة
  const pills = document.getElementById('filterPills');
  if (selectedTags.length > 0) {
    pills.classList.remove('hidden');
    pills.innerHTML = '<span>مفلتر بـ:</span>' + 
      selectedTags.map(t => `
        <span class="filter-pill">
          ${escapeHtml(t)}
          <button onclick="toggleTag('${escapeAttr(t)}')">✕</button>
        </span>
      `).join('') + 
      `<button class="tag-chip" onclick="clearTags()" style="text-decoration:underline">مسح الكل</button>`;
  } else {
    pills.classList.add('hidden');
  }
  
  // المستندات
  const filtered = getFilteredDocs();
  document.getElementById('docsCount').textContent = `(${filtered.length} مستند)`;
  
  const container = document.getElementById('docsContainer');
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📄</div>
        <h3>${documents.length === 0 ? 'ابدأ بإضافة مستندك الأول' : 'لا توجد نتائج'}</h3>
        <p>${documents.length === 0 ? 'سيتم حفظ مستنداتك بشكل دائم على متصفحك' : 'جرب تغيير معايير البحث أو الفلترة'}</p>
        ${documents.length === 0 ? '<button class="btn btn-primary" onclick="openDocModal()"><span>+</span><span>إضافة مستند</span></button>' : ''}
      </div>
    `;
  } else {
    container.innerHTML = '<div class="docs-grid">' + filtered.map(doc => {
      const folder = doc.folderId ? folders.find(f => f.id === doc.folderId) : null;
      return `
        <div class="doc-card" onclick="viewDoc('${doc.id}')">
          <div class="doc-card-header">
            <div class="doc-icon">📄</div>
            <div class="doc-actions" onclick="event.stopPropagation()">
              <button class="icon-btn ${doc.starred ? 'starred' : ''}" onclick="toggleStar('${doc.id}')" title="${doc.starred ? 'إزالة من المفضلة' : 'إضافة للمفضلة'}">
                ${doc.starred ? '⭐' : '☆'}
              </button>
              <button class="icon-btn" onclick="editDoc('${doc.id}')" title="تعديل">✏️</button>
              <button class="icon-btn delete" onclick="deleteDoc('${doc.id}')" title="حذف">🗑</button>
            </div>
          </div>
          <h3>${escapeHtml(doc.title)}</h3>
          ${doc.content ? `<p>${escapeHtml(doc.content.substring(0, 150))}</p>` : ''}
          ${(doc.tags && doc.tags.length > 0) ? `
            <div class="doc-tags">
              ${doc.tags.slice(0, 3).map(t => `<span class="doc-tag">${escapeHtml(t)}</span>`).join('')}
              ${doc.tags.length > 3 ? `<span class="doc-tag">+${doc.tags.length - 3}</span>` : ''}
            </div>
          ` : ''}
          <div class="doc-meta">
            <span>🕐 ${formatDate(doc.updatedAt)}</span>
            ${folder ? `<span>📁 ${escapeHtml(folder.name)}</span>` : ''}
          </div>
        </div>
      `;
    }).join('') + '</div>';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'");
}

// إجراءات
function setFolder(id) {
  currentFolder = id;
  starredFilter = false;
  render();
}

function toggleStarredFilter() {
  starredFilter = !starredFilter;
  if (starredFilter) currentFolder = null;
  render();
}

function toggleTag(tag) {
  if (selectedTags.includes(tag)) {
    selectedTags = selectedTags.filter(t => t !== tag);
  } else {
    selectedTags.push(tag);
  }
  render();
}

function clearTags() {
  selectedTags = [];
  render();
}

function toggleStar(id) {
  const doc = documents.find(d => d.id === id);
  if (doc) {
    doc.starred = !doc.starred;
    doc.updatedAt = Date.now();
    saveData();
    render();
  }
}

function deleteDoc(id) {
  if (confirm('تأكيد حذف المستند؟')) {
    documents = documents.filter(d => d.id !== id);
    saveData();
    render();
    showToast('تم الحذف');
  }
}

function deleteFolder(id) {
  if (confirm('حذف المجلد سيحرك مستنداته للجذر. متابعة؟')) {
    folders = folders.filter(f => f.id !== id);
    documents.forEach(d => { if (d.folderId === id) d.folderId = null; });
    if (currentFolder === id) currentFolder = null;
    saveData();
    render();
  }
}

// مودال المستند
function openDocModal() {
  editingDocId = null;
  document.getElementById('docModalTitle').textContent = 'مستند جديد';
  document.getElementById('docTitle').value = '';
  document.getElementById('docContent').value = '';
  document.getElementById('docTags').value = '';
  document.getElementById('docFolder').value = currentFolder || '';
  document.getElementById('docType').value = 'note';
  document.getElementById('docModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('docTitle').focus(), 50);
}

function editDoc(id) {
  const doc = documents.find(d => d.id === id);
  if (!doc) return;
  editingDocId = id;
  document.getElementById('docModalTitle').textContent = 'تعديل المستند';
  document.getElementById('docTitle').value = doc.title || '';
  document.getElementById('docContent').value = doc.content || '';
  document.getElementById('docTags').value = (doc.tags || []).join(', ');
  document.getElementById('docFolder').value = doc.folderId || '';
  document.getElementById('docType').value = doc.type || 'note';
  document.getElementById('docModal').classList.remove('hidden');
}

function closeDocModal() {
  document.getElementById('docModal').classList.add('hidden');
  editingDocId = null;
}

function saveDoc() {
  const title = document.getElementById('docTitle').value.trim();
  if (!title) {
    alert('من فضلك أدخل عنوان المستند');
    return;
  }
  const data = {
    title,
    content: document.getElementById('docContent').value.trim(),
    tags: document.getElementById('docTags').value.split(',').map(t => t.trim()).filter(Boolean),
    folderId: document.getElementById('docFolder').value || null,
    type: document.getElementById('docType').value,
    size: document.getElementById('docContent').value.length,
    updatedAt: Date.now()
  };
  
  if (editingDocId) {
    const doc = documents.find(d => d.id === editingDocId);
    Object.assign(doc, data);
  } else {
    documents.push({
      id: Date.now().toString(),
      ...data,
      createdAt: Date.now(),
      starred: false
    });
  }
  saveData();
  render();
  closeDocModal();
  showToast(editingDocId ? 'تم التعديل' : 'تم الحفظ');
}

// مودال المجلد
function openFolderModal() {
  document.getElementById('folderName').value = '';
  document.getElementById('folderModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('folderName').focus(), 50);
}

function closeFolderModal() {
  document.getElementById('folderModal').classList.add('hidden');
}

function saveFolder() {
  const name = document.getElementById('folderName').value.trim();
  if (!name) return;
  folders.push({ id: Date.now().toString(), name, createdAt: Date.now() });
  saveData();
  render();
  closeFolderModal();
  showToast('تم إنشاء المجلد');
}

// عرض المستند
function viewDoc(id) {
  const doc = documents.find(d => d.id === id);
  if (!doc) return;
  viewingDocId = id;
  document.getElementById('viewTitle').textContent = doc.title;
  document.getElementById('viewSubtitle').textContent = 
    `${typeLabels[doc.type] || 'مستند'} · ${formatDate(doc.updatedAt)}`;
  
  const tagsEl = document.getElementById('viewTags');
  if (doc.tags && doc.tags.length > 0) {
    tagsEl.innerHTML = doc.tags.map(t => `<span class="view-tag">${escapeHtml(t)}</span>`).join('');
    tagsEl.classList.remove('hidden');
  } else {
    tagsEl.classList.add('hidden');
  }
  
  const folderEl = document.getElementById('viewFolder');
  if (doc.folderId) {
    const f = folders.find(x => x.id === doc.folderId);
    folderEl.textContent = '📁 ' + (f ? f.name : '');
    folderEl.classList.remove('hidden');
  } else {
    folderEl.classList.add('hidden');
  }
  
  document.getElementById('viewContent').textContent = doc.content || '';
  document.getElementById('viewModal').classList.remove('hidden');
}

function closeViewModal() {
  document.getElementById('viewModal').classList.add('hidden');
  viewingDocId = null;
}

function editFromView() {
  const id = viewingDocId;
  closeViewModal();
  editDoc(id);
}

// البحث
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// Enter للحفظ السريع
document.getElementById('folderName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveFolder();
});

// أغلق المودال بـ Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDocModal();
    closeFolderModal();
    closeViewModal();
  }
});

// التهيئة
loadData();
render();
</script>
</body>
</html>
